<svg viewBox="0 0 1798 875" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Вручную отрисованный городской фон">
<defs>
  <!-- Background -->
  <linearGradient id="skyV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6da9cf"/>
    <stop offset="0.56" stop-color="#7fb6d8"/>
    <stop offset="1" stop-color="#9bc9e2"/>
  </linearGradient>
  <radialGradient id="skyGlow" cx="52%" cy="78%" r="72%">
    <stop offset="0" stop-color="#b1d7ea" stop-opacity=".42"/>
    <stop offset=".58" stop-color="#9ac8e1" stop-opacity=".16"/>
    <stop offset="1" stop-color="#6fa9ce" stop-opacity="0"/>
  </radialGradient>

  <!-- Blue building faces -->
  <linearGradient id="blueDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#557d9f"/>
    <stop offset="1" stop-color="#6489a8"/>
  </linearGradient>
  <linearGradient id="blueDark2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4e7393"/>
    <stop offset="1" stop-color="#5c82a1"/>
  </linearGradient>
  <linearGradient id="blueMid" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#79a9ca"/>
    <stop offset="1" stop-color="#8fbfda"/>
  </linearGradient>
  <linearGradient id="blueLight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bfe2f0"/>
    <stop offset="1" stop-color="#cceaf5"/>
  </linearGradient>
  <linearGradient id="blueLight2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a9d4e8"/>
    <stop offset="1" stop-color="#ccebf5"/>
  </linearGradient>
  <linearGradient id="bluePale" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c9e7f2"/>
    <stop offset="1" stop-color="#b8dfef"/>
  </linearGradient>

  <!-- Foreground buildings -->
  <linearGradient id="whiteFront" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f2f1f1"/>
    <stop offset="1" stop-color="#e8e9ea"/>
  </linearGradient>
  <linearGradient id="whiteSide" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#eeeeef"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="grayFront" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d0d0d1"/>
    <stop offset="1" stop-color="#c4c6c8"/>
  </linearGradient>
  <linearGradient id="graySide" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c4c6c8"/>
    <stop offset="1" stop-color="#ececed"/>
  </linearGradient>
  <filter id="tinySoft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation=".28"/></filter>
</defs>

<!-- sky -->
<rect width="1798" height="875" fill="url(#skyV)"/>
<rect width="1798" height="875" fill="url(#skyGlow)"/>

