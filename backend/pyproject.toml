[project]
name = "responders-academy-backend"
version = "0.1.0"
description = "Бэкенд и ML тренажёра АРМ-112 (Responders Academy): совместимая замена мок-API фронта + новые эндпоинты /api/v1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "symspellpy>=6.7",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "reportlab>=4.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pg = ["asyncpg>=0.29"]
nlp = ["sentence-transformers>=3.0", "torch>=2.2"]
tts = ["torch>=2.2", "soundfile>=0.12"]
stt = ["vosk>=0.3.45"]
llm = ["ollama>=0.3"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ml"]

[tool.hatch.build.targets.wheel.force-include]
"data/fonts" = "app/data/fonts"

[tool.uv]
default-groups = []

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]
